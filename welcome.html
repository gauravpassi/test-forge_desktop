<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            padding: 96px 16px 32px;
        }

        .container {
            text-align: center;
            padding: 3rem;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.2);
            max-width: 600px;
            animation: fadeIn 1s ease-in;
        }

        /* Navbar */
        .navbar {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 40px);
            max-width: 1100px;
            z-index: 10;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.25);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 24px;
            animation: navDrop 0.6s cubic-bezier(0.22, 1, 0.36, 1) both;
        }
        @keyframes navDrop {
            from { opacity: 0; transform: translate(-50%, -20px); }
            to { opacity: 1; transform: translate(-50%, 0); }
        }
        .nav-brand {
            display: flex; align-items: center; gap: 10px;
            color: #fff; font-weight: 700; font-size: 1.15rem;
            letter-spacing: 0.5px; text-decoration: none;
        }
        .nav-brand .logo-dot {
            width: 12px; height: 12px; border-radius: 50%;
            background: linear-gradient(135deg, #ff6584, #f093fb);
            box-shadow: 0 0 12px rgba(255, 101, 132, 0.6);
        }
        .nav-links {
            list-style: none; display: flex; gap: 8px; margin: 0; padding: 0;
        }
        .nav-links a {
            display: inline-block;
            color: rgba(255, 255, 255, 0.9);
            text-decoration: none;
            font-size: 0.92rem; font-weight: 500;
            padding: 8px 16px;
            border-radius: 10px;
            transition: background 0.25s ease, color 0.25s ease, transform 0.25s ease;
        }
        .nav-links a:hover {
            background: rgba(255, 255, 255, 0.18);
            transform: translateY(-1px);
        }
        .nav-links a.active {
            background: #fff;
            color: #764ba2;
        }
        .nav-toggle {
            display: none;
            background: none; border: none; cursor: pointer;
            padding: 8px; color: #fff;
        }
        .nav-toggle svg { width: 24px; height: 24px; }
        @media (max-width: 640px) {
            .navbar { padding: 10px 16px; }
            .nav-toggle { display: inline-flex; }
            .nav-links {
                position: absolute;
                top: calc(100% + 8px); left: 0; right: 0;
                flex-direction: column; gap: 4px;
                background: rgba(40, 30, 80, 0.85);
                backdrop-filter: blur(20px);
                border-radius: 16px;
                border: 1px solid rgba(255, 255, 255, 0.2);
                padding: 10px;
                opacity: 0; pointer-events: none;
                transform: translateY(-6px);
                transition: opacity 0.2s ease, transform 0.2s ease;
            }
            .nav-links.open {
                opacity: 1; pointer-events: auto; transform: translateY(0);
            }
            .nav-links a { display: block; text-align: center; }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            font-size: 3.5rem;
            margin-bottom: 1rem;
            letter-spacing: 2px;
        }

        p {
            font-size: 1.2rem;
            margin-bottom: 2rem;
            line-height: 1.6;
            opacity: 0.95;
        }

        .btn {
            display: inline-block;
            padding: 12px 32px;
            background: #fff;
            color: #667eea;
            text-decoration: none;
            border-radius: 50px;
            font-weight: bold;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }
    </style>
</head>
<body>
    <nav class="navbar" aria-label="Primary">
        <a href="welcome.html" class="nav-brand">
            <span class="logo-dot" aria-hidden="true"></span>
            <span>Nova</span>
        </a>
        <button class="nav-toggle" aria-label="Toggle menu" aria-expanded="false" aria-controls="primary-nav">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <ul id="primary-nav" class="nav-links">
            <li><a href="welcome.html" class="active">Home</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Services</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </nav>

    <div class="container">
        <h1>Welcome!</h1>
        <p>We're glad to have you here. Explore, create, and enjoy your journey with us.</p>
        <a href="contact.html" class="btn">Get Started</a>
    </div>
    <script src="script.js"></script>
</body>
</html>
