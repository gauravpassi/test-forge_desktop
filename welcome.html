<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            padding: 2rem 1rem;
        }

        .container {
            text-align: center;
            padding: 3rem;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.2);
            max-width: 800px;
            width: 100%;
            animation: fadeIn 1s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            font-size: 3.5rem;
            margin-bottom: 1rem;
            letter-spacing: 2px;
        }

        p {
            font-size: 1.2rem;
            margin-bottom: 2rem;
            line-height: 1.6;
            opacity: 0.95;
        }

        .slider {
            position: relative;
            width: 100%;
            max-width: 720px;
            margin: 0 auto 2rem;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
            aspect-ratio: 16 / 9;
            background: rgba(0, 0, 0, 0.2);
        }

        .slides {
            display: flex;
            width: 100%;
            height: 100%;
            transition: transform 0.6s ease-in-out;
        }

        .slide {
            flex: 0 0 100%;
            width: 100%;
            height: 100%;
            position: relative;
        }

        .slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .slide-caption {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 1rem;
            background: linear-gradient(transparent, rgba(0, 0, 0, 0.7));
            color: #fff;
            font-size: 1rem;
            text-align: left;
        }

        .slider-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0, 0, 0, 0.5);
            color: #fff;
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            font-size: 1.5rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s, transform 0.2s;
            z-index: 2;
        }

        .slider-btn:hover {
            background: rgba(0, 0, 0, 0.8);
            transform: translateY(-50%) scale(1.1);
        }

        .slider-btn.prev { left: 12px; }
        .slider-btn.next { right: 12px; }

        .dots {
            position: absolute;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
            z-index: 2;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.5);
            border: none;
            cursor: pointer;
            transition: background 0.2s, transform 0.2s;
        }

        .dot.active {
            background: #fff;
            transform: scale(1.2);
        }

        .btn {
            display: inline-block;
            padding: 12px 32px;
            background: #fff;
            color: #667eea;
            text-decoration: none;
            border-radius: 50px;
            font-weight: bold;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }

        @media (max-width: 600px) {
            h1 { font-size: 2.2rem; }
            .container { padding: 1.5rem; }
            .slider-btn { width: 36px; height: 36px; font-size: 1.2rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Welcome!</h1>
        <p>We're glad to have you here. Explore, create, and enjoy your journey with us.</p>

        <div class="slider" id="slider">
            <div class="slides" id="slides">
                <div class="slide">
                    <img src="https://picsum.photos/id/1018/1200/675" alt="Mountain landscape">
                    <div class="slide-caption">Explore breathtaking landscapes</div>
                </div>
                <div class="slide">
                    <img src="https://picsum.photos/id/1015/1200/675" alt="River between mountains">
                    <div class="slide-caption">Discover new horizons</div>
                </div>
                <div class="slide">
                    <img src="https://picsum.photos/id/1019/1200/675" alt="Forest view">
                    <div class="slide-caption">Reconnect with nature</div>
                </div>
                <div class="slide">
                    <img src="https://picsum.photos/id/1043/1200/675" alt="City at night">
                    <div class="slide-caption">Experience the city vibes</div>
                </div>
                <div class="slide">
                    <img src="https://picsum.photos/id/1039/1200/675" alt="Aerial mountain view">
                    <div class="slide-caption">Adventure awaits</div>
                </div>
            </div>
            <button class="slider-btn prev" id="prevBtn" aria-label="Previous slide">&#10094;</button>
            <button class="slider-btn next" id="nextBtn" aria-label="Next slide">&#10095;</button>
            <div class="dots" id="dots"></div>
        </div>

        <a href="#" class="btn">Get Started</a>
    </div>

    <script>
        (function () {
            const slidesEl = document.getElementById('slides');
            const slides = slidesEl.querySelectorAll('.slide');
            const dotsEl = document.getElementById('dots');
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');
            const sliderEl = document.getElementById('slider');
            const total = slides.length;
            let current = 0;
            let autoplay;

            slides.forEach((_, i) => {
                const dot = document.createElement('button');
                dot.className = 'dot' + (i === 0 ? ' active' : '');
                dot.setAttribute('aria-label', 'Go to slide ' + (i + 1));
                dot.addEventListener('click', () => goTo(i));
                dotsEl.appendChild(dot);
            });
            const dots = dotsEl.querySelectorAll('.dot');

            function goTo(index) {
                current = (index + total) % total;
                slidesEl.style.transform = `translateX(-${current * 100}%)`;
                dots.forEach((d, i) => d.classList.toggle('active', i === current));
            }

            function next() { goTo(current + 1); }
            function prev() { goTo(current - 1); }

            nextBtn.addEventListener('click', () => { next(); resetAutoplay(); });
            prevBtn.addEventListener('click', () => { prev(); resetAutoplay(); });

            function startAutoplay() { autoplay = setInterval(next, 4000); }
            function resetAutoplay() { clearInterval(autoplay); startAutoplay(); }

            sliderEl.addEventListener('mouseenter', () => clearInterval(autoplay));
            sliderEl.addEventListener('mouseleave', startAutoplay);

            startAutoplay();
        })();
    </script>
</body>
</html>
