<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
        }

        .container {
            text-align: center;
            padding: 3rem;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.2);
            max-width: 600px;
            animation: fadeIn 1s ease-in;
        }

        .slider {
            position: relative;
            width: 100%;
            max-width: 500px;
            height: 320px;
            margin: 0 auto 2rem;
            overflow: hidden;
            border-radius: 15px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
        }

        .slides {
            display: flex;
            width: 100%;
            height: 100%;
            transition: transform 0.6s ease-in-out;
        }

        .slides img {
            width: 100%;
            height: 100%;
            flex-shrink: 0;
            object-fit: cover;
        }

        .slider-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0, 0, 0, 0.4);
            color: #fff;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 1.2rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        .slider-btn:hover {
            background: rgba(0, 0, 0, 0.7);
        }

        .slider-btn.prev { left: 10px; }
        .slider-btn.next { right: 10px; }

        .dots {
            position: absolute;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.5);
            cursor: pointer;
            transition: background 0.2s;
        }

        .dot.active {
            background: #fff;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            font-size: 3.5rem;
            margin-bottom: 1rem;
            letter-spacing: 2px;
        }

        p {
            font-size: 1.2rem;
            margin-bottom: 2rem;
            line-height: 1.6;
            opacity: 0.95;
        }

        .btn {
            display: inline-block;
            padding: 12px 32px;
            background: #fff;
            color: #667eea;
            text-decoration: none;
            border-radius: 50px;
            font-weight: bold;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Welcome!</h1>
        <p>We're glad to have you here. Meet our furry friends below!</p>

        <div class="slider">
            <div class="slides" id="slides">
                <img src="https://images.dog.ceo/breeds/retriever-golden/n02099601_100.jpg" alt="Golden Retriever">
                <img src="https://images.dog.ceo/breeds/husky/n02110185_1469.jpg" alt="Husky">
                <img src="https://images.dog.ceo/breeds/labrador/n02099712_5642.jpg" alt="Labrador">
                <img src="https://images.dog.ceo/breeds/pug/n02110958_15626.jpg" alt="Pug">
                <img src="https://images.dog.ceo/breeds/beagle/n02088364_11136.jpg" alt="Beagle">
            </div>
            <button class="slider-btn prev" id="prevBtn" aria-label="Previous">&#10094;</button>
            <button class="slider-btn next" id="nextBtn" aria-label="Next">&#10095;</button>
            <div class="dots" id="dots"></div>
        </div>

        <a href="#" class="btn">Get Started</a>
    </div>

    <script>
        const slides = document.getElementById('slides');
        const totalSlides = slides.children.length;
        const dotsContainer = document.getElementById('dots');
        let currentIndex = 0;

        for (let i = 0; i < totalSlides; i++) {
            const dot = document.createElement('span');
            dot.className = 'dot' + (i === 0 ? ' active' : '');
            dot.addEventListener('click', () => goToSlide(i));
            dotsContainer.appendChild(dot);
        }

        function updateSlider() {
            slides.style.transform = `translateX(-${currentIndex * 100}%)`;
            document.querySelectorAll('.dot').forEach((dot, i) => {
                dot.classList.toggle('active', i === currentIndex);
            });
        }

        function goToSlide(index) {
            currentIndex = (index + totalSlides) % totalSlides;
            updateSlider();
        }

        document.getElementById('prevBtn').addEventListener('click', () => goToSlide(currentIndex - 1));
        document.getElementById('nextBtn').addEventListener('click', () => goToSlide(currentIndex + 1));

        setInterval(() => goToSlide(currentIndex + 1), 4000);
    </script>
</body>
</html>
